<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="#ffffff" />
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Transformer Tank Body -->
  <rect x="180" y="160" width="440" height="260" rx="12" fill="url(#tankGrad)" stroke="#cbd5e1" stroke-width="3" filter="url(#softShadow)" />
  
  <!-- Cooling Fins / Radiators Left -->
  <path d="M 120 200 L 180 200 M 120 230 L 180 230 M 120 260 L 180 260 M 120 290 L 180 290 M 120 320 L 180 320 M 120 350 L 180 350 M 120 380 L 180 380" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <rect x="110" y="190" width="12" height="200" rx="4" fill="#64748b" />

  <!-- Cooling Fins / Radiators Right -->
  <path d="M 620 200 L 680 200 M 620 230 L 680 230 M 620 260 L 680 260 M 620 290 L 680 290 M 620 320 L 680 320 M 620 350 L 680 350 M 620 380 L 680 380" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <rect x="678" y="190" width="12" height="200" rx="4" fill="#64748b" />

  <!-- Magnetic Core (Visible cutaway) -->
  <rect x="240" y="220" width="320" height="150" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- 3 Phase Windings (Copper coils) -->
  <!-- Phase A -->
  <g transform="translate(265, 235)">
    <rect x="0" y="0" width="70" height="120" rx="8" fill="url(#copperGrad)" filter="url(#softShadow)" />
    <path d="M 10 15 H 60 M 10 35 H 60 M 10 55 H 60 M 10 75 H 60 M 10 95 H 60" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <text x="35" y="65" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">Phase A</text>
  </g>

  <!-- Phase B -->
  <g transform="translate(365, 235)">
    <rect x="0" y="0" width="70" height="120" rx="8" fill="url(#copperGrad)" filter="url(#softShadow)" />
    <path d="M 10 15 H 60 M 10 35 H 60 M 10 55 H 60 M 10 75 H 60 M 10 95 H 60" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <text x="35" y="65" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">Phase B</text>
  </g>

  <!-- Phase C -->
  <g transform="translate(465, 235)">
    <rect x="0" y="0" width="70" height="120" rx="8" fill="url(#copperGrad)" filter="url(#softShadow)" />
    <path d="M 10 15 H 60 M 10 35 H 60 M 10 55 H 60 M 10 75 H 60 M 10 95 H 60" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <text x="35" y="65" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">Phase C</text>
  </g>

  <!-- High Voltage Bushings (Top) -->
  <g transform="translate(275, 75)">
    <polygon points="15,85 35,85 30,15 20,15" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <circle cx="25" cy="15" r="7" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
    <line x1="25" y1="8" x2="25" y2="0" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
  </g>
  <g transform="translate(375, 75)">
    <polygon points="15,85 35,85 30,15 20,15" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <circle cx="25" cy="15" r="7" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
    <line x1="25" y1="8" x2="25" y2="0" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
  </g>
  <g transform="translate(475, 75)">
    <polygon points="15,85 35,85 30,15 20,15" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <circle cx="25" cy="15" r="7" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
    <line x1="25" y1="8" x2="25" y2="0" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Conservator Tank -->
  <rect x="520" y="80" width="120" height="50" rx="25" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5" />
  <line x1="560" y1="130" x2="560" y2="160" stroke="#94a3b8" stroke-width="6" />

  <!-- Acoustic Sensors (Piezoelectric Hydrophones) -->
  <g transform="translate(200, 310)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow)" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8">
      <animate attributeName="r" values="14;28" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
  <text x="200" y="340" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">Sensor A</text>

  <g transform="translate(600, 310)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow)" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8">
      <animate attributeName="r" values="14;28" dur="2s" begin="0.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2s" begin="0.7s" repeatCount="indefinite" />
    </circle>
  </g>
  <text x="600" y="340" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">Sensor B</text>

  <!-- Thermal Optical Fiber / Probe Sensor -->
  <g transform="translate(400, 395)">
    <circle cx="0" cy="0" r="12" fill="#ea580c" stroke="#ffffff" stroke-width="3" filter="url(#softShadow)" />
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c2410c" text-anchor="middle">Fiber Optic Temp Probe</text>
  </g>

  <!-- Title / Label -->
  <text x="400" y="465" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">
    SoundGrid AI Cyber-Physical Transformer Instrumentation Schematic
  </text>
</svg>
